version: '3.8'

services:
  web-ui:
    build: services/web-ui
    container_name: helga-web-ui
    ports:
      - "5050:5000"
    depends_on:
      core-logic:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_ENV=production
      - CORE_LOGIC_URL=http://helga-core-logic:5003
      - RAG_URL=http://helga-rag-engine:5002
      - TTS_URL=http://helga-tts:5005
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./services/web-ui:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal

  core-logic:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    container_name: helga-core-logic
    ports:
      - "5003:5003"
    depends_on:
      rag-engine:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:14b
      - RAG_URL=http://helga-rag-engine:5002
      - TTS_URL=http://helga-tts:5005
      - WEB_UI_URL=http://helga-web-ui:5000
      - RESEARCH_URL=http://helga-research:5006
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./services/core:/app/services/core
      - ./services/common:/app/services/common
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  rag-engine:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: helga-rag-engine
    ports:
      - "5002:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:14b
      - HF_HOME=/app/data/hf_cache
      - TRANSFORMERS_CACHE=/app/data/hf_cache
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./services/rag:/app/services/rag
      - ./services/common:/app/services/common
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - internal

  tts:
    build: services/tts
    container_name: helga-tts
    ports:
      - "5005:5005"
    volumes:
      - ./data/tts_cache:/app/data/tts_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - internal

  searxng:
    image: searxng/searxng:latest
    container_name: helga-searxng
    restart: unless-stopped
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    environment:
      - BASE_URL=http://localhost:8080
      - INSTANCE_NAME=helga-search
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal

  research:
    build:
      context: .
      dockerfile: services/research/Dockerfile
    container_name: helga-research
    ports:
      - "5006:5006"
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      - SEARXNG_URL=http://helga-searxng:8080
      - FLASK_ENV=production
    volumes:
      - ./data/research_cache:/app/data/research_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - internal

networks:
  internal:
    driver: bridge
