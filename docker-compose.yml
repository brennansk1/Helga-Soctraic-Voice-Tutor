
services:
  web-ui:
    # Context is the repo root, not the service dir: the preflight endpoint
    # imports services/common (memory_guard, startup_preflight), which a
    # service-scoped context cannot see. Same pattern core-logic already uses.
    build:
      context: .
      dockerfile: services/web-ui/Dockerfile
    container_name: helga-web-ui
    ports:
      - "5050:5000"
    depends_on:
      core-logic:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # web-ui was never told which model the stack actually uses, so its
      # preflight and setup pages checked the built-in default and could
      # confidently report on the wrong model name.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nail-35b-a3b-ctx}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - CORE_LOGIC_URL=http://helga-core-logic:5003
      - RAG_URL=http://helga-rag-engine:5002
      # TTS runs natively on the host (Kokoro on MLX) by default, like Ollama
      # and STT; `--profile portable` starts the containerised torch fallback.
      - TTS_URL=${TTS_URL:-http://host.docker.internal:5005}
      # STT runs natively on the host (Nemotron-MLX/ANE) by default, like Ollama;
      # set STT_URL=http://helga-stt:5001 to use the containerized faster-whisper fallback.
      - STT_URL=${STT_URL:-http://host.docker.internal:5001}
      # /deps is where the shared packages below are mounted. It exists because
      # this service, unlike core and rag, bind-mounts its own source directly
      # over /app — so nesting a mount at /app/services/... would make Docker
      # materialise empty `services/web-ui/services/` directories in the repo
      # on the host. A separate root plus PYTHONPATH keeps the working tree
      # clean and does not depend on mount ordering.
      - PYTHONPATH=/deps
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./services/web-ui:/app
      # The /app mount above hides whatever the image copied into /app, so
      # services/common must be mounted alongside it or the import works in
      # the image and fails in the running container.
      - ./services/common:/app/services/common
      # The domain layer, alongside common. A bind mount SHADOWS the image, so
      # shipping it in the Dockerfile is not enough on its own — without this
      # line a dev container would still have no `services/domains` under the
      # mounted tree, and every domain import would fail exactly as before.
      - ./services/domains:/app/services/domains
      # auth.py and parent_api.py do `from services.common.storage import ...`,
      # but this service's layout puts app.py at /app (not /app/services/web-ui
      # like core and rag), so the sys.path.insert in auth.py resolved to "/"
      # and there was no services/ package anywhere on the path. The container
      # was in a crash loop on `ModuleNotFoundError: No module named 'services'`
      # at import time — same root cause as the missing tools/ mount on
      # core-logic: the code's import graph is wider than the paths the
      # container was given. services/ has no __init__.py, so it resolves as a
      # namespace package under /deps exactly as it does under /app for core.
      - ./services/common:/deps/services/common
      # storage.mastery_overview (called by app.py's mastery route) lazily
      # imports services.core.fsrs_engine and, on ImportError, sets engine=None
      # — which quietly drops the `retention` field from every concept in the
      # parent dashboard rather than failing. fsrs_engine imports only math and
      # logging, so this mount costs no packages and no image change.
      - ./services/core:/deps/services/core:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # 256M -> 384M. This is the one service whose usage could not be
          # measured (it was crash-looping, so `docker stats` reported 0B), and
          # an unmeasured limit should err high: it terminates TLS-less uploads
          # and runs the /library preview through pypdf + Pillow, so a single
          # large book decodes in-process. gevent's greenlet stacks sit on top
          # of that. 256M was the tightest cap in the file on the service with
          # the least predictable peak.
          memory: 384M
    networks:
      - internal

  core-logic:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    container_name: helga-core-logic
    ports:
      - "5003:5003"
    depends_on:
      rag-engine:
        condition: service_healthy
      research:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nail-35b-a3b-ctx}
      # How long Ollama holds the weights after the last request, and the one
      # knob that trades the two scarcest resources on this box against each
      # other. Resident, the model is ~12.7 GB against a measured safe ceiling
      # of ~15.0 GB; past ~16.4 GB the machine thrashes, and that boundary is a
      # cliff rather than a slope. Pinning it forever spends most of the
      # headroom on the hours nobody is studying — exactly the hours the night
      # audit, verification passes and host-native TTS/STT want the RAM back.
      # Releasing it is not free either: reloading costs ~133 s from the
      # external disk, paid by whoever asks the next question. 30m splits the
      # difference — it outlasts a student staring at a hard question, so
      # nothing inside a session pays the reload, and the memory comes back
      # once a session is genuinely over.
      #
      # This has to be passed INTO the container, not merely set on the host:
      # every request carries a keep_alive field read from this variable, and a
      # per-request value overrides the server's own OLLAMA_KEEP_ALIVE. A host
      # configured to evict plus a container still sending -1 gives you -1.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - LLM_MODEL=${LLM_MODEL:-nail-35b-a3b-ctx}
      - HELGA_BUILD_MODEL=${HELGA_BUILD_MODEL:-nail-35b-a3b-ctx}
      - HELGA_TUTOR_MODEL=${HELGA_TUTOR_MODEL:-nail-35b-a3b-ctx}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - IMAGE_WORKERS=${IMAGE_WORKERS:-2}
      # B23.1: GPU gate cap — must equal the host's OLLAMA_NUM_PARALLEL
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - HELGA_BG_SLOTS=${HELGA_BG_SLOTS:-2}
      # B15.6: per-student FSM registry sizing
      - FSM_REGISTRY_MAX=${FSM_REGISTRY_MAX:-64}
      - FSM_IDLE_TTL=${FSM_IDLE_TTL:-1800}
      - FSM_SWEEP_INTERVAL=${FSM_SWEEP_INTERVAL:-60}
      - RAG_URL=http://helga-rag-engine:5002
      # TTS runs natively on the host (Kokoro on MLX) by default, like Ollama
      # and STT; `--profile portable` starts the containerised torch fallback.
      - TTS_URL=${TTS_URL:-http://host.docker.internal:5005}
      - WEB_UI_URL=http://helga-web-ui:5000
      - RESEARCH_URL=http://helga-research:5006
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./services/core:/app/services/core
      - ./services/common:/app/services/common
      # The domain layer, alongside common. A bind mount SHADOWS the image, so
      # shipping it in the Dockerfile is not enough on its own — without this
      # line a dev container would still have no `services/domains` under the
      # mounted tree, and every domain import would fail exactly as before.
      - ./services/domains:/app/services/domains
      # `scope_check` imports services.research.curriculum_research
      # IN-PROCESS. The build itself talks to the research SERVICE over HTTP,
      # which is why builds were fine while the pre-build scope check was not.
      # Without this mount the import fails and the endpoint returns
      # {"available": false} — rendered in the creation UI as "the research
      # service could not be reached", naming the wrong cause: the service was
      # up and healthy, the MODULE was absent from this container.
      - ./services/research:/app/services/research
      # course_builder imports tools.syllabus_check (quality gate criterion 6).
      # These bind mounts REPLACE the image's filesystem at their paths, so
      # mounting only core and common left /app/tools missing even after the
      # Dockerfile COPYs it — the import would fail here specifically, in the
      # dev setup that is the one everybody actually runs. Read-only because
      # the service reads the module and must never write to the repo's tools/.
      - ./tools:/app/tools:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # KEPT at 512M. Measured 103 MiB idle (20%), but idle is not the
          # sizing case: this is the course-build service and its peak holds a
          # whole course structure plus hydrated concept text, with tiktoken,
          # sympy, scikit-learn and pypdf resident, across up to
          # FSM_REGISTRY_MAX=64 live sessions. 5x headroom over idle is the
          # right shape for a spiky workload; an OOM here kills a build that
          # took minutes.
          memory: 512M
    networks:
      - internal

  rag-engine:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: helga-rag-engine
    ports:
      - "5002:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nail-35b-a3b-ctx}
      # Same value as core-logic, and it has to be here too. This service
      # issues LLM calls of its own, and the timer is reset by whichever
      # request arrived last — so one service still sending -1 would silently
      # re-pin the model for the whole box no matter what the others send.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - HF_HOME=/app/data/hf_cache
      - TRANSFORMERS_CACHE=/app/data/hf_cache
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./services/rag:/app/services/rag
      - ./services/common:/app/services/common
      # The degree shape gate lives here. Without it the pipeline blueprint
      # cannot hold an externally authored degree to the bar a local one meets.
      - ./tools:/app/tools:ro
      # The domain layer, alongside common. A bind mount SHADOWS the image, so
      # shipping it in the Dockerfile is not enough on its own — without this
      # line a dev container would still have no `services/domains` under the
      # mounted tree, and every domain import would fail exactly as before.
      - ./services/domains:/app/services/domains
      # librarian.py imports services.core in four places that are NOT guarded
      # by try/except — catalog_admin.transition_catalog_course (the admin
      # transition route), course_builder.SkeletonBuilder (wizard preview),
      # course_builder.ContentHydrator (wizard hydration) — plus three guarded
      # fsrs_engine call sites. `docker exec helga-rag-engine python -c "import
      # services.core.fsrs_engine"` returns ModuleNotFoundError today, so the
      # unguarded ones 500 and the guarded ones silently downgrade FSRS
      # scheduling to fixed intervals.
      #
      # Mounting rather than COPYing: whether rag should reach into core at all
      # or call it over HTTP is an architecture question this file should not
      # answer by baking the coupling into the image. The mount makes the
      # imports that already exist actually resolve. It needs no new packages —
      # the whole chain (course_builder -> depth_contract, scaffolding,
      # llm_utils, storage) imports nothing third-party at module scope beyond
      # `requests`, which rag already has.
      - ./services/core:/app/services/core:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # 768M -> 384M. The 768M was sized for the sentence-transformers era;
          # services/rag/requirements.txt has since REMOVED that (and with it
          # the whole PyTorch chain) because embeddings now come from Ollama
          # over HTTP. Nothing heavy loads in-process any more, and it measures
          # 36 MiB resident — 4.7% of the old cap. 384M is ~10x observed and
          # still leaves room for the real spike path, pypdf/Pillow reading a
          # wizard source document.
          memory: 384M
    networks:
      - internal

  # Kokoro TTS. PRIMARY deployment is NATIVE on the host, reached at
  # host.docker.internal:5005 like Ollama and STT — see services/tts/README.md.
  #
  # This block is the PORTABLE FALLBACK and is behind a profile, so `docker
  # compose up` neither builds nor starts it. It previously ran by default with
  # mlx-audio in its requirements, which cannot work: MLX publishes a Linux
  # wheel but there is no Metal inside a Linux container, and the `kokoro`
  # torch fallback was commented out of requirements.txt — so the container had
  # no working backend at all. The container path therefore uses torch Kokoro;
  # MLX belongs on the host.
  #
  #   docker compose --profile portable up      # start the fallback
  #   TTS_URL=http://helga-tts:5005             # ...and point the app at it
  tts:
    build: services/tts
    profiles: ["portable"]
    container_name: helga-tts
    ports:
      - "5005:5005"
    environment:
      - TTS_BACKEND=torch
    volumes:
      - ./data/tts_cache:/app/data/tts_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # KEPT at 2048M, and both measurements agree on why.
          #
          # 2048M looks absurd next to an 82M-parameter model whose weights are
          # 319 MB on disk. What this container loads is the PyTorch fallback
          # chain around those weights — torch, transformers, spacy, misaki's
          # G2P — none of which the host MLX backend pulls in at all. A loaded
          # torch CPU process is ~1.2-1.8 GB resident whatever the model weighs.
          #
          # Measured on this image (2026-08-19) synthesising the service's own
          # maximum 5,000-character request: 1.38 GB anonymous, 2.03 GB peak
          # RSS, against a 34 MB idle footprint. The same run at a 1536M limit
          # was OOM-killed mid-request. So this is close to the floor, not the
          # ceiling, and trimming it turns the portable fallback into one that
          # dies the first time a lesson speaks a long paragraph.
          #
          # It costs nothing at rest: this service sits behind
          # `profiles: ["portable"]` and does not start on a plain
          # `docker compose up`. The host MLX deployment is the default and is
          # not governed by this block at all.
          memory: 2048M
    networks:
      - internal

  searxng:
    image: searxng/searxng:latest
    container_name: helga-searxng
    restart: unless-stopped
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    environment:
      - BASE_URL=http://localhost:8080
      - INSTANCE_NAME=helga-search
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # 256M -> 384M, i.e. UP. This was the only container anywhere near
          # its cap: measured 191 MiB, 74.7% of 256M, while every Helga service
          # sat under 21%. searxng is uwsgi with several worker processes and
          # is fanned out to concurrently during research/hydration, which is
          # precisely when the remaining 65 MiB would go. The audit assumed the
          # waste was here; the measurement says the risk was.
          memory: 384M
    networks:
      - internal

  research:
    build:
      context: .
      dockerfile: services/research/Dockerfile
    container_name: helga-research
    ports:
      - "5006:5006"
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      - SEARXNG_URL=http://helga-searxng:8080
      - FLASK_ENV=production
    volumes:
      # THE RESEARCH SERVICE RAN THE IMAGE'S COPY OF ITS OWN CODE.
      # core, rag and web-ui all bind-mount their source; this one did not, so
      # every edit here needed a rebuild — and a `docker compose restart` after
      # changing a file looked like it had applied and had not. Measured: a
      # relevance guard added to domain_sources.py was absent from the running
      # container while the same restart-and-test loop reported no change.
      # Flat layout on purpose: this image puts its modules at /app, not
      # /app/services/research.
      - ./services/research:/app
      - ./data/research_cache:/app/data/research_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # 384M -> 256M. Measured 59 MiB (15% of the old cap). The dependency
          # set is flask + aiohttp + diskcache + trafilatura; nothing here holds
          # a model. 256M is ~4x observed, sized so that lxml parsing one large
          # fetched page — the only real spike — still fits.
          memory: 256M
    networks:
      - internal

  # Offline STT — Learn voice input.
  # PRIMARY deployment is NATIVE on the host (Nemotron-3.5-ASR via MLX/ANE),
  # reached at host.docker.internal:5001 like Ollama — see services/stt/README.md.
  # The block below is the CONTAINERIZED FALLBACK (faster-whisper, CPU). To use it,
  # uncomment and set STT_URL=http://helga-stt:5001 for the web-ui service.
  # Offline STT — Learn voice input.
  #
  # PRIMARY deployment is NATIVE on the host (Nemotron-3.5-ASR via MLX/ANE) at
  # host.docker.internal:5001, like Ollama. This block is the CONTAINERISED
  # FALLBACK (faster-whisper, CPU).
  #
  # It was fully written and left COMMENTED OUT while two comments above told
  # you to "set STT_URL=http://helga-stt:5001 to use the containerized
  # fallback" — a service that did not exist, so `docker compose up stt`
  # answered "no such service". Now defined behind the same `portable` profile
  # as the TTS fallback: the default `docker compose up` is unchanged, and
  #     docker compose --profile portable up -d stt
  # gives you voice input with no host process.
  stt:
    profiles: ["portable"]
    build: services/stt
    container_name: helga-stt
    ports:
      - "5001:5001"
    environment:
      - STT_BACKEND=faster-whisper
      - STT_MODEL=distil-large-v3
    volumes:
      - ./data/hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - internal

networks:
  internal:
    driver: bridge
