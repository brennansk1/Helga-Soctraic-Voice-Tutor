{% extends "base.html" %}

{% block title %}Helga - Test{% endblock %}

{% block content %}
<div class="learn-container theme-test">
    <!-- Chat Interface (Adapted for Test) -->
    <div class="session-interface">
        <div class="ai-avatar-container">
            <div class="ai-avatar pulse" style="background-color: var(--accent-tertiary);">
                <span style="font-size: 2rem;">📝</span>
            </div>
            <div class="status-indicator">Examiner Mode</div>
        </div>

        <!-- Chat Stream -->
        <div class="conversation-log" id="test-chat-stream">
            <div class="message ai">
                <span>Initializing adaptive test module...</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <input type="text" id="test-input" placeholder="Type your answer..." class="text-input">
            <button id="test-send-btn" class="control-btn send-btn" title="Send" aria-label="Send"
                style="background-color: var(--accent-tertiary);">➤</button>
        </div>
    </div>
</div>

<style>
    /* "Blue Mountain" / Duolingo-style Test Theme */
    .learn-container.theme-test {
        margin: 0 auto;
        max-width: 900px;
        padding-top: 2rem;
    }

    .theme-test .session-interface {
        background: var(--bg-secondary);
        border: 2px solid var(--border-color);
        border-radius: 24px;
        box-shadow: var(--shadow-card);
        overflow: hidden;
        height: calc(100vh - 120px);
    }

    .ai-avatar-container {
        background: var(--bg-tertiary);
        /* Light blue top header */
        padding: 1.5rem;
        border-bottom: 2px solid var(--border-color);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .theme-test .ai-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--bg-secondary);
        border: 4px solid var(--accent-tertiary);
        /* Indigo */
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: var(--shadow-soft);
        margin-bottom: 0.5rem;
    }

    .status-indicator {
        font-weight: 800;
        color: var(--accent-tertiary);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.9rem;
    }

    .conversation-log {
        flex: 1;
        padding: 2rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        background: var(--bg-primary);
    }

    .message {
        padding: 1.5rem;
        border-radius: 20px;
        font-size: 1.1rem;
        max-width: 85%;
        line-height: 1.6;
        box-shadow: var(--shadow-soft);
    }

    .theme-test .message.ai {
        background: var(--bg-secondary);
        border: 2px solid var(--border-color);
        border-bottom-left-radius: 4px;
        color: var(--text-primary);
    }

    .message.user {
        background: var(--accent-tertiary);
        /* Indigo for test */
        color: var(--bg-primary);
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }

    /* Result styling inside messages */
    .message strong {
        font-weight: 800;
    }

    .theme-test .controls {
        padding: 1.5rem;
        background: var(--bg-secondary);
        border-top: 2px solid var(--border-color);
        display: flex;
        gap: 1rem;
        align-items: center;
    }

    .text-input {
        flex: 1;
        padding: 1rem 1.5rem;
        font-size: 1.1rem;
        border: 2px solid var(--border-color);
        border-radius: 16px;
        background: var(--bg-primary);
        color: var(--text-primary);
    }

    .text-input:focus {
        border-color: var(--accent-tertiary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .send-btn {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--accent-tertiary) !important;
        box-shadow: 0 4px 0 var(--accent-primary) !important;
        /* Darker indigo */
        font-size: 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .send-btn:active {
        box-shadow: none !important;
        transform: translateY(4px);
    }

    /* Responsive overrides for test page */
    @media (max-width: 768px) {
        .learn-container.theme-test {
            padding-top: 1rem;
        }
        .theme-test .session-interface {
            height: auto;
            min-height: 60vh;
            max-height: calc(100vh - 100px);
        }
        .theme-test .controls {
            padding: 1rem;
        }
    }

    @media (max-width: 480px) {
        .learn-container.theme-test {
            padding-top: 0.5rem;
            max-width: 100%;
        }
        .theme-test .session-interface {
            height: auto;
            min-height: 65vh;
            max-height: calc(100vh - 80px);
            border-radius: 16px;
        }
        .conversation-log {
            padding: 0.75rem;
            gap: 0.75rem;
        }
        .message {
            font-size: 0.9rem;
            padding: 1rem;
        }
        .theme-test .controls {
            padding: 0.75rem;
            gap: 0.5rem;
        }
        .text-input {
            font-size: 16px;
            padding: 0.7rem 1rem;
        }
        .send-btn {
            width: 48px;
            height: 48px;
        }
        .ai-avatar-container {
            padding: 0.75rem;
        }
        .theme-test .ai-avatar {
            width: 60px;
            height: 60px;
        }
    }
</style>

<script>
    const chatStream = document.getElementById('test-chat-stream');
    const inputField = document.getElementById('test-input');
    const sendBtn = document.getElementById('test-send-btn');
    const statusIndicator = document.querySelector('.status-indicator');

    let currentContext = "";
    let currentQuestionText = "";
    let currentConceptUid = "";
    let currentCourseUid = "";
    let waitingForAnswer = false;
    let selectedCourseUid = null;
    let selectedDifficulty = "concept"; // concept | unit | module
    let score = { correct: 0, total: 0 };

    // XSS-safe: escape HTML entities
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Safe text message — no HTML injection
    function addMessageText(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        const span = document.createElement('span');
        span.textContent = text;
        div.appendChild(span);
        chatStream.appendChild(div);
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    // Structured HTML — only for controlled templates with escaped data
    function addMessageHtml(html, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = html;
        chatStream.appendChild(div);
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    function updateScoreDisplay() {
        if (score.total > 0) {
            statusIndicator.textContent = `Score: ${score.correct}/${score.total} (${Math.round(score.correct / score.total * 100)}%)`;
        }
    }

    // UX-7: Course selection before quiz starts
    async function showCourseSelection() {
        chatStream.innerHTML = '';
        const loader = addLoadingMessage('Loading courses…');

        // Timeout so this page can't sit on "Loading courses..." forever
        // when /api/courses hangs.
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        try {
            const res = await fetch('/api/courses', { signal: controller.signal });
            clearTimeout(timeoutId);
            removeLoadingMessage(loader);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            if (!data.courses || data.courses.length === 0) {
                chatStream.innerHTML = '';
                addMessageText("No courses found. Create a course first to start testing!", 'ai');
                inputField.disabled = true;
                return;
            }

            chatStream.innerHTML = '';

            // Build selection UI
            const div = document.createElement('div');
            div.className = 'message ai';

            const heading = document.createElement('p');
            heading.innerHTML = '<strong>📝 Choose a course to test:</strong>';
            div.appendChild(heading);

            const grid = document.createElement('div');
            grid.className = 'selection-grid';
            grid.style.cssText = 'display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:1rem;';

            // "All Courses" option
            const allBtn = document.createElement('button');
            allBtn.className = 'select-btn';
            allBtn.style.cssText = 'padding:1rem; border-radius:12px; border:2px solid var(--border-color); background:var(--bg-primary); cursor:pointer; text-align:left; transition:all 0.2s;';
            const allStrong = document.createElement('strong');
            allStrong.textContent = '🎲 All Courses';
            allStrong.style.display = 'block';
            const allSpan = document.createElement('span');
            allSpan.textContent = 'Random mix of all topics';
            allSpan.style.cssText = 'font-size:0.85rem; color:var(--text-secondary);';
            allBtn.appendChild(allStrong);
            allBtn.appendChild(allSpan);
            allBtn.addEventListener('click', () => startQuiz(null, 'All Courses'));
            grid.appendChild(allBtn);

            // Per-course buttons
            data.courses.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'select-btn';
                btn.style.cssText = 'padding:1rem; border-radius:12px; border:2px solid var(--border-color); background:var(--bg-primary); cursor:pointer; text-align:left; transition:all 0.2s;';

                const strong = document.createElement('strong');
                strong.textContent = c.title;
                strong.style.display = 'block';
                const span = document.createElement('span');
                span.textContent = `${c.stats?.total_concepts || '?'} concepts`;
                span.style.cssText = 'font-size:0.85rem; color:var(--text-secondary);';

                btn.appendChild(strong);
                btn.appendChild(span);
                btn.addEventListener('click', () => startQuiz(c.uid, c.title));
                grid.appendChild(btn);
            });

            div.appendChild(grid);

            // Difficulty selector
            const diffDiv = document.createElement('div');
            diffDiv.style.cssText = 'margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border-color);';
            diffDiv.innerHTML = '<p style="font-weight:600; margin-bottom:0.5rem;">Question Difficulty:</p>';
            const diffGrid = document.createElement('div');
            diffGrid.style.cssText = 'display:flex; gap:0.5rem; flex-wrap:wrap;';
            [
                {val: 'concept', label: 'Concept', desc: 'Specific concept questions'},
                {val: 'unit', label: 'Unit', desc: 'Broader unit-level questions'},
                {val: 'module', label: 'Module', desc: 'High-level synthesis questions'},
            ].forEach(d => {
                const btn = document.createElement('button');
                btn.style.cssText = 'padding:0.5rem 1rem; border-radius:8px; border:2px solid var(--border-color); background:var(--bg-primary); cursor:pointer; font-size:0.85rem;';
                if (d.val === selectedDifficulty) btn.style.borderColor = 'var(--accent-tertiary)';
                const strong = document.createElement('strong');
                strong.textContent = d.label;
                btn.appendChild(strong);
                btn.addEventListener('click', () => {
                    selectedDifficulty = d.val;
                    diffGrid.querySelectorAll('button').forEach(b => b.style.borderColor = 'var(--border-color)');
                    btn.style.borderColor = 'var(--accent-tertiary)';
                });
                diffGrid.appendChild(btn);
            });
            diffDiv.appendChild(diffGrid);
            div.appendChild(diffDiv);

            chatStream.appendChild(div);

        } catch (e) {
            clearTimeout(timeoutId);
            removeLoadingMessage(loader);
            const msg = e.name === 'AbortError'
                ? "Couldn't reach the course API — the server is slow or unreachable."
                : "Error loading courses: " + (e.message || e);
            addMessageText(msg, 'ai');
            // Offer a retry instead of leaving the page dead
            const retry = document.createElement('button');
            retry.className = 'btn-alpine btn-alpine-secondary';
            retry.style.cssText = 'margin-top:0.75rem;';
            retry.textContent = 'Retry';
            retry.addEventListener('click', () => { retry.remove(); showCourseSelection(); });
            chatStream.appendChild(retry);
            chatStream.scrollTop = chatStream.scrollHeight;
        }
    }

    function startQuiz(courseUid, label) {
        selectedCourseUid = courseUid;
        score = { correct: 0, total: 0 };
        chatStream.innerHTML = '';
        addMessageText(`Starting test: ${label}`, 'user');
        statusIndicator.textContent = 'Examiner Mode';
        loadQuestion();
    }

    function addLoadingMessage(labelText) {
        const div = document.createElement('div');
        div.className = 'message ai quiz-loading-msg';
        div.innerHTML =
            '<span class="inline-dots" aria-hidden="true"><span></span><span></span><span></span></span>' +
            ' <span class="quiz-loading-label"></span>';
        div.querySelector('.quiz-loading-label').textContent = labelText;
        chatStream.appendChild(div);
        chatStream.scrollTop = chatStream.scrollHeight;
        return div;
    }

    function removeLoadingMessage(el) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    async function loadQuestion() {
        const loader = addLoadingMessage('Generating question…');
        try {
            let url = '/api/quiz';
            if (selectedCourseUid) {
                url += `?course_uid=${encodeURIComponent(selectedCourseUid)}`;
            }
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            removeLoadingMessage(loader);

            if (data.error) {
                addMessageText(`Error: ${data.error}`, 'ai');
                addRetryQuestionButton();
                return;
            }

            currentQuestionText = data.question;
            currentContext = data.context_text;
            currentConceptUid = data.concept_uid || "";
            currentCourseUid = data.course_uid || "";
            addMessageText(currentQuestionText, 'ai');
            waitingForAnswer = true;
            inputField.focus();

        } catch (e) {
            removeLoadingMessage(loader);
            console.error('Quiz fetch error:', e);
            addMessageText("Connection error while fetching quiz. The server may be unavailable.", 'ai');
            if (window.showToast) window.showToast('Failed to load question', 'error');
            addRetryQuestionButton();
        }
    }

    function addRetryQuestionButton() {
        const btn = document.createElement('button');
        btn.className = 'btn-alpine btn-alpine-secondary';
        btn.style.cssText = 'margin-top:0.5rem;';
        btn.textContent = 'Try again';
        btn.addEventListener('click', () => {
            btn.remove();
            loadQuestion();
        });
        chatStream.appendChild(btn);
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    async function submitAnswer() {
        const text = inputField.value.trim();
        if (!text) return;

        if (!waitingForAnswer) {
            if (text.toLowerCase() === 'next') {
                inputField.value = '';
                addMessageText(text, 'user');
                loadQuestion();
                return;
            }
            addMessageText(text, 'user');
            addMessageText("Please type 'next' to continue or wait for the question.", 'ai');
            inputField.value = '';
            return;
        }

        addMessageText(text, 'user');
        inputField.value = '';
        waitingForAnswer = false;

        // Loading indicator — animated dots match the rest of the app
        const loadingMsg = addLoadingMessage('Grading your answer…');

        try {
            const res = await fetch('/api/quiz/grade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: currentQuestionText,
                    answer: text,
                    context: currentContext,
                    concept_uid: currentConceptUid,
                    course_uid: currentCourseUid
                })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            removeLoadingMessage(loadingMsg);

            const isPass = data.grade === 'PASS';
            const gradeColor = isPass ? 'var(--status-success, #2ecc71)' : 'var(--status-error, #e74c3c)';
            const emoji = isPass ? '✅' : '❌';

            // Track score
            score.total++;
            if (isPass) score.correct++;
            updateScoreDisplay();

            // Escape server-returned feedback and missing concepts
            const safeFeedback = escapeHtml(data.feedback || '');
            const safeMissing = data.missing_concepts
                ? '<br><br><strong>Missing:</strong> ' + data.missing_concepts.map(c => escapeHtml(c)).join(', ')
                : '';

            // Flashcard creation notification (Anki integration)
            const flashcardNote = data.cards_created && data.cards_created > 0
                ? `<div style="margin-top:0.75rem; padding:0.5rem 0.75rem; background:rgba(99,102,241,0.1); border-radius:8px; font-size:0.85rem; color:var(--accent-tertiary, #6366f1);">🃏 ${data.cards_created} flashcard(s) added for review</div>`
                : '';

            const resultHtml = `
                <strong style="color:${gradeColor}">${emoji} ${escapeHtml(data.grade)}</strong> (${parseInt(data.score) || 0}%)<br><br>
                ${safeFeedback}
                ${safeMissing}
                ${flashcardNote}
                <br><br>
                <button class="next-question-btn" style="padding:0.5rem 1rem; border-radius:8px; border:none; background:${gradeColor}; color:var(--bg-primary); cursor:pointer; font-weight:600;">Next Question</button>
                <button class="change-course-btn" style="padding:0.5rem 1rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-primary); color:var(--text-secondary); cursor:pointer; font-weight:600; margin-left:0.5rem;">Change Course</button>
            `;
            addMessageHtml(resultHtml, 'ai');

            // Bind buttons via addEventListener
            const lastMsg = chatStream.lastElementChild;
            const nextBtn = lastMsg.querySelector('.next-question-btn');
            if (nextBtn) nextBtn.addEventListener('click', loadQuestion);
            const changeBtn = lastMsg.querySelector('.change-course-btn');
            if (changeBtn) changeBtn.addEventListener('click', showCourseSelection);

        } catch (e) {
            removeLoadingMessage(loadingMsg);
            console.error('Grade error:', e);
            addMessageText("Error grading answer. Your answer has been preserved -- press Send to retry.", 'ai');
            if (window.showToast) window.showToast('Failed to grade answer', 'error');
            waitingForAnswer = true;  // let the user resubmit
            inputField.value = text;
            inputField.focus();
        }
    }

    sendBtn.addEventListener('click', submitAnswer);
    inputField.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitAnswer();
    });

    // Init — show course selection first
    document.addEventListener('DOMContentLoaded', showCourseSelection);
</script>
{% endblock %}
