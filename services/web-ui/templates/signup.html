{% extends "base.html" %}
{% block title %}Sign up — Helga Socratic Voice Tutor{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo-badge">
                <span class="i i-user-plus"></span>
            </div>
            <h1 class="auth-title">Create Family Account</h1>
            <p class="auth-subtitle">One account manages all family learners with encrypted data storage</p>
        </div>

        <form id="signup-form" autocomplete="on" class="auth-form">
            <div class="form-group">
                <label for="su-name" class="form-label">Parent / Guardian Name</label>
                <div class="input-wrapper">
                    <span class="input-icon i i-user"></span>
                    <input id="su-name" name="display_name" type="text" required autocomplete="name" class="form-input" placeholder="Sarah Miller">
                </div>
            </div>

            <div class="form-group">
                <label for="su-email" class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon i i-mail"></span>
                    <input id="su-email" name="email" type="email" required autocomplete="email" class="form-input" placeholder="sarah@example.com">
                </div>
            </div>

            <div class="form-group">
                <label for="su-password" class="form-label">Password <span class="text-muted">(8+ characters)</span></label>
                <div class="input-wrapper">
                    <span class="input-icon i i-key"></span>
                    <input id="su-password" name="password" type="password" required minlength="8" autocomplete="new-password" class="form-input" placeholder="••••••••">
                </div>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input id="su-tos" type="checkbox" required class="form-checkbox">
                    <span>I agree to the Terms of Service and consent to learning data encryption on this self-hosted server (COPPA Parental Consent).</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary auth-submit-btn" id="signup-btn">
                <span>Create Family Account</span>
            </button>

            <div id="signup-error" class="auth-error-alert" role="alert" aria-live="polite" hidden></div>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login" class="auth-link">Log in</a></p>
        </div>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: var(--space-4, 1rem);
}
.auth-card {
    width: 100%;
    max-width: 460px;
    padding: 2.5rem 2rem;
    background: var(--surface-glass, rgba(255, 255, 255, 0.85));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-color, rgba(255, 255, 255, 0.2));
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0,0,0,0.05);
}
@media (prefers-color-scheme: dark) {
    .auth-card {
        background: rgba(18, 24, 38, 0.85);
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
}
.auth-header {
    text-align: center;
    margin-bottom: 1.5rem;
}
.auth-logo-badge {
    width: 56px;
    height: 56px;
    margin: 0 auto 1rem;
    background: linear-gradient(135deg, var(--brand-primary, #4f46e5), #818cf8);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.75rem;
    box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
}
.auth-title {
    font-size: 1.75rem;
    font-weight: 700;
    margin: 0 0 0.5rem;
}
.auth-subtitle {
    font-size: 0.875rem;
    color: var(--text-muted, #6b7280);
    margin: 0;
}
.form-group {
    margin-bottom: 1.25rem;
}
.form-label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
}
.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}
.input-icon {
    position: absolute;
    left: 1rem;
    color: var(--text-muted, #9ca3af);
    pointer-events: none;
}
.form-input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    border-radius: 10px;
    border: 1px solid var(--border-color, #d1d5db);
    background: var(--input-bg, #fff);
    font-size: 0.95rem;
}
.form-input:focus {
    outline: none;
    border-color: var(--brand-primary, #4f46e5);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}
.checkbox-group {
    margin-bottom: 1.25rem;
}
.checkbox-label {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
    font-size: 0.82rem;
    color: var(--text-muted, #4b5563);
    line-height: 1.4;
}
.form-checkbox {
    margin-top: 0.15rem;
    accent-color: var(--brand-primary, #4f46e5);
}
.auth-submit-btn {
    width: 100%;
    padding: 0.85rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--brand-primary, #4f46e5), #6366f1);
    color: white;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}
.auth-error-alert {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    background: rgba(220, 38, 38, 0.1);
    border: 1px solid rgba(220, 38, 38, 0.3);
    border-radius: 8px;
    color: #dc2626;
    font-size: 0.875rem;
}
.auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.9rem;
}
.auth-link {
    color: var(--brand-primary, #4f46e5);
    font-weight: 600;
    text-decoration: none;
}
.auth-link:hover { text-decoration: underline; }
</style>

<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('signup-error');
    const btn = document.getElementById('signup-btn');
    errEl.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Creating Account…';

    try {
        const res = await fetch('/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRF-Token': window.CSRF_TOKEN},
            body: JSON.stringify({
                display_name: document.getElementById('su-name').value,
                email: document.getElementById('su-email').value,
                password: document.getElementById('su-password').value,
            }),
        });
        if (res.ok) {
            window.location.href = '/mode-select';
        } else {
            const data = await res.json().catch(() => ({}));
            errEl.textContent = data.error || 'Could not create account.';
            errEl.hidden = false;
        }
    } catch (err) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.hidden = false;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Create Family Account';
    }
});
</script>
{% endblock %}
