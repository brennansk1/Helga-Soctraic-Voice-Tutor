<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default learner avatar. Replaced at runtime by an uploaded image
  (window._userAvatarSrc); this is the fallback and the Settings preview.

  Like helga-avatar.svg, this was referenced but missing, so Settings showed a
  broken image and every learner message in a session did too.
-->
