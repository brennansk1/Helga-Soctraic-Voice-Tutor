  <circle cx="32" cy="32" r="32" fill="#e8f4f0"/>
  <circle cx="32" cy="25" r="10" fill="#6b7c6e"/>
  <path d="M12 56a20 20 0 0 1 40 0z" fill="#6b7c6e"/>
</svg>
